<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOWCASE — Acceso</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon_vinilo.svg" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
  </head>
  <body>
    <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
    <nav>
      <a class="logo" href="principal.html">SHOW<span>CASE</span></a>
      <span class="nav-tag" id="nav-tag">// acceso</span>
    </nav>

    <!-- ── Contenido centrado ─────────────────────────────────────────────── -->
    <div class="page-wrapper">
      <div class="card">
        <p class="card-tag">// bienvenido</p>
        <h2 id="titulo">Iniciar sesión</h2>

        <form id="formulario" novalidate>
          <!-- Email / usuario -->
          <div class="form-group">
            <label for="usuario" id="usuario_lbl">Email</label>
            <input
              type="text"
              id="usuario"
              placeholder="tu@email.com"
              required
            />
            <span id="error-email"></span
            ><!--mensaje de email inválido-->
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password" id="password_lbl">Contraseña</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>

          <!-- campo_registro: visible en registro, oculto en login (lo gestiona login.js según ?accion=) -->
          <div id="campo_registro">
            <!-- Contraseña -->
            <div class="form-group">
              <label for="password2" id="password_lbl2"
                >Repetir contraseña</label
              >
              <input
                type="password"
                id="password2"
                placeholder="••••••••"
                required
              />
              <span id="error-password"></span
              ><!--mensaje de contraseñas no coincidentes-->
            </div>
            <div class="form-group">
              <label for="nombre" id="nombre_lbl">Nombre</label>
              <input type="text" id="nombre" placeholder="Tu nombre" />
            </div>
            <div class="form-group">
              <label for="apellido" id="apellido_lbl">Apellido</label>
              <input type="text" id="apellido" placeholder="Tu apellido" />
            </div>
            <div class="form-group">
              <label for="rol_select" id="rol_lbl">Rol</label>
              <div class="select-wrapper">
                <select name="rol" id="rol_select">
                  <option value="USUARIO">Usuario</option>
                  <option value="PRODUCTOR">Productor</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Botones -->
          <div class="btn-group">
            <button type="submit" name="enviar" class="btn-accion btn-enviar">
              Enviar
            </button>
            <button
              type="button"
              onclick="cancelar()"
              class="btn-accion btn-cancelar"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
